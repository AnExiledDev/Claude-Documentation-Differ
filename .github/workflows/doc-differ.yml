name: Claude Code Documentation Differ

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Shared concurrency group serializes all differ pushes to prevent rebase conflicts
concurrency:
  group: differ-push
  cancel-in-progress: false

jobs:
  differ:
    uses: ./.github/workflows/differ-reusable.yml
    with:
      source: claude-code
      source_display_name: Claude Code
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
