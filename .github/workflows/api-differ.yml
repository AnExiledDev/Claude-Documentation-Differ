name: Claude API Documentation Differ

on:
  schedule:
    # Run every 48 hours (at midnight UTC on odd days)
    # API docs are ~10x larger (539 pages vs 54), so less frequent updates
    - cron: '0 0 1-31/2 * *'
  workflow_dispatch:

permissions:
  contents: write

# Shared concurrency group serializes all differ pushes to prevent rebase conflicts
concurrency:
  group: differ-push
  cancel-in-progress: false

jobs:
  differ:
    uses: ./.github/workflows/differ-reusable.yml
    with:
      source: api
      source_display_name: Claude API
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
