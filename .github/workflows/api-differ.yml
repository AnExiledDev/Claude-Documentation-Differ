name: Claude API Documentation Differ

on:
  schedule:
    # Run every 48 hours (at midnight UTC on odd days)
    # API docs are ~10x larger (539 pages vs 54), so less frequent updates
    - cron: '0 0 1-31/2 * *'
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: write

jobs:
  fetch-and-diff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Need full history for diffing
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch Claude API documentation
        run: python3 fetch.py --source api --force
        # Use slower rate limit for large doc set to avoid rate limiting
        # Default 1.0s should be fine, but can increase if needed

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet docs/api/ && git diff --staged --quiet docs/api/; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit documentation changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git add docs/api/
          git commit -m "Claude API docs update: $(date -u +%Y-%m-%d\ %H:%M\ UTC)"

      - name: Install Claude Code CLI
        if: steps.check_changes.outputs.changes == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate changelog
        if: steps.check_changes.outputs.changes == 'true'
        run: python3 diff.py --source api --changelog --force
        env:
          # Use OAuth token for Claude Code authentication
          # Set CLAUDE_CODE_OAUTH_TOKEN secret in repo settings
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - name: Commit changelog and push
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git add output/api/ || true
          git commit -m "Add Claude API changelog for $(date -u +%Y-%m-%d)" || true
          git push

      - name: Summary
        run: |
          if [ "${{ steps.check_changes.outputs.changes }}" == "true" ]; then
            echo "## Claude API Documentation Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "New API documentation has been fetched and a changelog has been generated." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ -f output/api/*_changelog.md ]; then
              echo "### Latest Changelog" >> $GITHUB_STEP_SUMMARY
              cat output/api/*_changelog.md | head -100 >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "## No Claude API Documentation Changes Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Claude API documentation is up to date." >> $GITHUB_STEP_SUMMARY
          fi
